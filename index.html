.table { overflow-x: auto; margin: 1.25em 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; line-height: 1.55; }

tr:last-child td { border-bottom: 1px solid var(--rule); }
th { font-weight: 600; }
td:first-child { color: var(--muted); white-space: nowrap; padding-right: 1.5em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 4rem 0; }
footer { padding-top: 1.25rem; padding-bottom: 3rem; border-top: 1px solid var(--rule);
         font-size: 0.875rem; color: var(--muted); }
footer a { color: inherit; }
.index main { padding-top: clamp(3rem, 14vh, 8rem); }
.mark { display: block; width: 72px; height: 72px; border-radius: 22.37%; margin-bottom: 1.5rem; }
.tagline { font-size: 1.3125rem; line-height: 1.4; color: var(--muted); margin: 0 0 3rem; }
.pages { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }

.pages a { display: block; padding: 0.9em 0; text-decoration: none; font-weight: 500; }
