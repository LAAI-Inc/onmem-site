<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — OnMem Photos</title>
<link rel="icon" type="image/png" href="/favicon.png">

<style>
:root { color-scheme: light dark;
  --bg: #fff; --fg: #1b1e27; --muted: #6a7080; --rule: #e4e6ec; --link: #4a5aa8; --code: #f1f2f6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161c; --fg: #e7e8ec; --muted: #9ba1b0; --rule: #2b2f3a; --link: #8fa6ff; --code: #1f222b; } }
html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
       "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
nav.lang, main, footer { max-width: 40rem; margin: 0 auto; padding-left: 1.25rem; padding-right: 1.25rem; }
nav.lang { padding-top: 1.25rem; padding-bottom: 1rem; font-size: 0.9375rem; }
nav.lang a { color: var(--muted); text-decoration: none; }
nav.lang a:hover { color: var(--fg); }
nav.lang a + a { margin-left: 0.875rem; padding-left: 0.875rem; border-left: 1px solid var(--rule); }
main { padding-top: 2rem; padding-bottom: 4rem; }
h1 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 2.5rem); line-height: 1.15; letter-spacing: -0.02em;
     font-weight: 700; margin: 0 0 0.5em; }
section > h1 + p { color: var(--muted); font-size: 0.9375rem; margin-top: 0; }
section > h1 + p strong { font-weight: 500; }
h2 { font-size: 1.375rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 650; margin: 2.75em 0 0.6em; }
h3 { font-size: 1.0625rem; line-height: 1.4; font-weight: 600; margin: 2em 0 0.4em; }
p, ul, ol { margin: 0 0 1em; }
ul, ol { padding-left: 1.4em; }
li { margin: 0.35em 0; }
li::marker { color: var(--muted); }
strong { font-weight: 600; }
a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em;
    text-decoration-color: color-mix(in srgb, var(--link) 45%, transparent); }
a:hover { text-decoration-color: var(--link); }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.875em;
       background: var(--code); padding: 0.1em 0.4em; border-radius: 4px; }
.table { overflow-x: auto; margin: 1.25em 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; line-height: 1.55; }
th, td { text-align: left; vertical-align: top; padding: 0.6em 0.9em 0.6em 0; border-top: 1px solid var(--rule); }
tr:last-child td { border-bottom: 1px solid var(--rule); }
th { font-weight: 600; }
td:first-child { color: var(--muted); white-space: nowrap; padding-right: 1.5em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 4rem 0; }
footer { padding-top: 1.25rem; padding-bottom: 3rem; border-top: 1px solid var(--rule);
         font-size: 0.875rem; color: var(--muted); }
footer a { color: inherit; }
.index main { padding-top: clamp(3rem, 14vh, 8rem); }
.mark { display: block; width: 72px; height: 72px; border-radius: 22.37%; margin-bottom: 1.5rem; }
.tagline { font-size: 1.3125rem; line-height: 1.4; color: var(--muted); margin: 0 0 3rem; }
.pages { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
.pages li { margin: 0; border-bottom: 1px solid var(--rule); }
.pages a { display: block; padding: 0.9em 0; text-decoration: none; font-weight: 500; }
.pages a:hover { color: var(--fg); }
</style>
</head>
<body class="index">
<main>
<h1>404</h1>
<p>There is no page at this address. 這個網址沒有頁面。</p>
<ul class="pages">
<li><a href="/privacy-policy/">Privacy Policy · 隱私政策</a></li>
<li><a href="/support/">Support · 支援</a></li>
</ul>
</main>
</body>
</html>
